<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI preview</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <aside class="denthub-sidebar denthub-sidebar-desktop d-none d-lg-flex">
        <div class="sidebar-brand"><div class="brand-img-wrap"><img src="assets/images/logowblue.png" alt="Logo"><img src="assets/images/denthubtxt.png" alt="DENTHUB"></div></div>
        <nav class="nav flex-column py-2">
            <a class="nav-link active" href="#"><i class="bi bi-grid-1x2 me-2"></i> Dashboard</a>
            <a class="nav-link" href="#"><i class="bi bi-calendar3 me-2"></i> Calendar</a>
        </nav>
    </aside>
    <main class="denthub-main" id="page">
        <div class="container-fluid py-4">
            <h1 class="denthub-page-title"><i class="bi bi-grid-1x2 me-2"></i> Dashboard</h1>
            <div class="row g-4 mb-4">
                <div class="col-md-3"><div class="card denthub-stat-card primary"><div class="card-body"><h6>Today's Appointments</h6><h3 id="first-card">12</h3></div></div></div>
                <div class="col-md-3"><div class="card denthub-stat-card success"><div class="card-body"><h6>Patients</h6><h3>48</h3></div></div></div>
            </div>
            <div class="card mb-4"><div class="card-body" style="min-height: 900px;"><p id="top-copy">Top of the page content. This line must stay visible under the title, not hidden behind it.</p><p style="margin-top: 780px;" id="bottom-copy">Bottom of the page. Scrolling the panel should reveal this without the title covering it.</p></div></div>
        </div>
    </main>
    <script src="assets/js/page-shell.js"></script>
</body>
</html>
